<style>
/* レイアウト：方眼紙の地にマークシート型の解答欄。上部タブで5画面を切替える1カラムアプリ */
:root{
  --paper:#f3f6f5; --grid:rgba(29,92,122,.07); --card:#ffffff; --ink:#1c2830; --muted:#5b6c74; --line:#d3ddda;
  --accent:#1d5c7a; --accent-soft:#e2eef3; --ucl:#b3372a; --ucl-soft:#f8e6e2; --ok:#276f43; --ok-soft:#e1f1e7; --warn:#a86a12;
  --f-body:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic",Meiryo,system-ui,sans-serif;
  --f-disp:var(--f-body);
  --f-num:var(--f-body);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10171b; --grid:rgba(111,179,210,.06); --card:#172126; --ink:#e2eaed; --muted:#93a5ac; --line:#2a3a41;
  --accent:#72b6d6; --accent-soft:#1b3340; --ucl:#ef7b64; --ucl-soft:#3a201b; --ok:#6cc290; --ok-soft:#18332a; --warn:#e0a84a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10171b; --grid:rgba(111,179,210,.06); --card:#172126; --ink:#e2eaed; --muted:#93a5ac; --line:#2a3a41;
  --accent:#72b6d6; --accent-soft:#1b3340; --ucl:#ef7b64; --ucl-soft:#3a201b; --ok:#6cc290; --ok-soft:#18332a; --warn:#e0a84a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-disp);font-size:1.25rem;letter-spacing:.04em;margin:0}
.brand small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);letter-spacing:.08em;margin-left:6px}
.count{margin-left:auto;font-size:.8rem;color:var(--muted)}
.count b{font-family:var(--f-num);color:var(--accent);font-size:1rem}
nav.tabs{max-width:760px;margin:0 auto;padding-inline:8px;display:flex;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px 8px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:700;font-size:.9rem}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
h2{font-family:var(--f-disp);font-size:1.15rem;margin:24px 0 10px;text-wrap:balance}
.lbl{font-size:.72rem;letter-spacing:.12em;color:var(--muted);font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px;border-left:3px solid var(--line)}

.kpi .v small{font-size:.8rem;color:var(--muted);font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--accent);background:var(--accent);color:var(--card);border-radius:4px;padding:10px 16px;font-weight:700;cursor:pointer;min-height:44px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--ucl);color:var(--ucl)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.start{display:grid;gap:10px}
.start .btn{justify-content:space-between;text-align:left;width:100%}
.start .btn span.sub{font-weight:400;font-size:.8rem;opacity:.85}
/* 分野別の正答率バー（50%線＝分野合格目安） */
.meter{position:relative;height:10px;background:var(--accent-soft);border-radius:2px;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.meter i.low{background:var(--ucl)}
.meter::after{content:"";position:absolute;left:70%;top:-2px;bottom:-2px;border-left:1px dashed var(--muted)}
.catrow{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:4px 12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:0}
.catrow .nm{font-size:.88rem;min-width:0}
.catrow .pc{font-family:var(--f-num);text-align:right;font-size:.88rem;font-variant-numeric:tabular-nums}
.catrow .meter{grid-column:1/-1}
.catrow .n{font-size:.72rem;color:var(--muted)}
/* 分野選択チップ */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 14px;cursor:pointer;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--card);font-weight:700}
/* 問題カード */
.qhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{font-size:.72rem;padding:2px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.tag.calc{background:var(--ucl-soft);color:var(--ucl)}
.qno{font-family:var(--f-num);color:var(--muted);font-size:.85rem}
.prog{height:4px;background:var(--line);border-radius:2px;margin:12px 0;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qtext{white-space:pre-wrap;font-size:1rem;margin:4px 0 14px;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:10px 12px;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .bub{width:30px;height:20px;border:1.5px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-size:.75rem;color:var(--muted)}
.opt .tx{overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--card)}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{border-color:var(--ucl);background:var(--ucl-soft)}
.opt.wrong .bub{background:var(--ucl);border-color:var(--ucl);color:var(--card)}
.opt:disabled{cursor:default}
/* 正誤フィードバック：Duolingo風に色面で結果を返す */
.fb{margin-top:14px;padding:14px 16px;border-radius:6px;border:2px solid var(--line);background:var(--paper);animation:fbIn .22s ease-out}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)}
.fb.ng{border-color:var(--ucl);background:var(--ucl-soft)}
.fb .res{font-weight:700;font-size:1.15rem;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb.ok .res{color:var(--ok)} .fb.ng .res{color:var(--ucl)}
.fb .mark{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--card);font-size:1rem;flex:none}
.fb.ok .mark{background:var(--ok)} .fb.ng .mark{background:var(--ucl)}
.fb .streak{font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--card);color:var(--warn);border:1px solid var(--warn)}
.fb p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.opt{transition:transform .08s ease,border-color .1s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.sel{background:var(--accent-soft);box-shadow:0 2px 0 var(--accent)}
.opt.right{animation:pop .35s ease-out}
.opt.wrong{animation:shake .35s ease-out}
.btn.check{min-width:140px}
.btn.check.ok{background:var(--ok);border-color:var(--ok)}
.btn.check.ng{background:var(--ucl);border-color:var(--ucl)}
.sound{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:.75rem;cursor:pointer;color:var(--muted)}
.sound[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
@keyframes fbIn{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.qfoot{display:flex;justify-content:space-between;gap:8px;margin-top:14px;flex-wrap:wrap}

.timer{font-family:var(--f-num);font-size:1.1rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--ucl)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:4px;margin-top:10px}
.qgrid button{border:1px solid var(--line);background:var(--card);border-radius:3px;padding:4px 0;font-family:var(--f-num);font-size:.75rem;cursor:pointer}
.qgrid button.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--accent)}
.qgrid button.r{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.qgrid button.w{background:var(--ucl-soft);border-color:var(--ucl);color:var(--ucl)}
.verdict{font-family:var(--f-disp);font-size:2rem;line-height:1.2}
.verdict.pass{color:var(--ok)} .verdict.fail{color:var(--ucl)}
.crit{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.crit div{border:1px solid var(--line);border-radius:4px;padding:10px;text-align:center}
.crit .v{font-family:var(--f-num);font-size:1.3rem;font-weight:600}
.crit .ok{color:var(--ok)} .crit .ng{color:var(--ucl)}
.confirm{margin-top:10px;padding:12px;border:1px solid var(--ucl);border-radius:4px;background:var(--ucl-soft)}
/* 数値表 */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--card);max-height:60vh}
table.nt{border-collapse:collapse;font-family:var(--f-num);font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
table.nt th,table.nt td{padding:4px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.nt thead th{position:sticky;top:0;background:var(--accent-soft);color:var(--accent);z-index:1}
table.nt tbody th{color:var(--accent);position:sticky;left:0;background:var(--card)}
table.nt tbody tr:nth-child(5n) td,table.nt tbody tr:nth-child(5n) th{border-bottom-color:var(--muted)}
.note{font-size:.8rem;color:var(--muted);margin:8px 0 0}
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--card);border-top:2px solid var(--accent);max-height:80vh;overflow:auto;padding-inline:16px;padding-block:12px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.18)}
.sheet .in{max-width:760px;margin:0 auto}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
/* 管理図風の推移グラフ */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:10px}
.empty{color:var(--muted);font-size:.9rem;padding:8px 0}
.status{font-size:.75rem;color:var(--muted)}
.wronglist{display:grid;gap:10px;margin-top:10px}
.wronglist .panel p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere}
/* 出題範囲との対応 */
.syl{padding-block:4px}
.syl details{border-bottom:1px solid var(--line)}
.syl details:last-child{border-bottom:0}
.syl summary{cursor:pointer;padding:10px 0;font-weight:700;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.syl summary .cnt{margin-left:auto;font-family:var(--f-num);font-weight:400;color:var(--muted);font-size:.85rem}
.sylrow{display:grid;grid-template-columns:minmax(0,1fr) 3.4em 3.4em auto;gap:8px;align-items:center;padding:6px 0 6px 8px;font-size:.85rem;border-top:1px dashed var(--line)}
.sylrow .num{font-family:var(--f-num);text-align:right;font-variant-numeric:tabular-nums}
.sylrow .num.low{color:var(--ucl)}
.sylrow .lv,.syl summary .lv{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:400;padding:0 6px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.syl details.lv3 summary{color:var(--muted)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:.8rem}
textarea{width:100%;box-sizing:border-box;margin-top:8px;padding:8px;font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:4px;background:var(--card);color:var(--ink)}
.report{margin-top:10px}.rprow{padding:10px 0;border-bottom:1px solid var(--line)}.rprow p{margin:4px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:6px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
/* 本試験形式：空欄の強調と多選択肢の2列表示 */
mark.blank{background:var(--accent-soft);color:var(--accent);font-weight:700;padding:0 4px;border-radius:3px;border-bottom:2px solid var(--accent)}
.tag.dai{background:var(--ok-soft);color:var(--ok)}
.opts.many{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.opts.many .opt{min-height:44px;padding:8px 10px}
/* 解説の下の関連資料 */
.ref{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:.82rem;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;color:var(--muted)}
.ref .lbl{margin-right:2px}
.linkbtn{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:700;text-decoration:underline;cursor:pointer;font-size:.82rem}
/* 資料タブ */
.links{display:grid;gap:0;padding-block:4px}
.lnk{display:grid;gap:2px;padding:10px 0;border-bottom:1px solid var(--line)}
.lnk:last-child{border-bottom:0}
.lnk a{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}
.lnk span{font-size:.8rem;color:var(--muted)}
.refrow{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr);gap:4px 12px;padding:10px 6px;border-bottom:1px solid var(--line);font-size:.85rem;border-radius:4px;transition:background .3s}
.refrow:last-child{border-bottom:0}
.refrow .nm{font-weight:700}
.refrow .nm .lbl{display:block}
.refrow.hit{background:var(--accent-soft)}
.jis{font-family:var(--f-num);color:var(--accent);white-space:nowrap}
.about p{margin:6px 0}
.ver-big{font-family:var(--f-num);font-size:1.6rem;font-weight:600;color:var(--accent)}
.ver-big small{font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:400;margin-left:10px}
.hist{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:4px 10px;padding:6px 0;font-size:.85rem;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:0}
.hist b{font-family:var(--f-num)}
.hist .d{font-family:var(--f-num);color:var(--muted)}
.appfoot{margin-top:32px;padding-top:12px;border-top:1px solid var(--line);font-size:.75rem;color:var(--muted);text-align:center}
.appfoot .ver{font-family:var(--f-num);color:var(--accent);font-weight:600}
@media (max-width:520px){.refrow{grid-template-columns:1fr}.hist{grid-template-columns:auto 1fr}.hist span:last-child{grid-column:1/-1}}
@media (max-width:420px){.kpi .v{font-size:1.2rem}.crit .v{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.streakchip{font-family:var(--f-num);font-size:.78rem;font-weight:600;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 8px;align-self:center}
.streakchip.pending{opacity:.6}
.today .trow{display:flex;gap:14px;align-items:center}
.flame{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-num);font-weight:600;font-size:1.3rem;border:2px solid var(--line);color:var(--muted)}
.flame.on{border-color:var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.gbar{height:10px;border-radius:999px;background:var(--accent-soft);overflow:hidden;margin-top:6px}
.gbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .3s}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}

.day.today{outline:2px solid var(--accent);outline-offset:1px}
.story{font-family:var(--f-disp);margin:8px 0;line-height:1.8}
.story.clear{color:var(--ok)}
.pathmsg{font-weight:700;color:var(--accent);margin:8px 0 0}

.chap[open]{padding-bottom:14px}
.stages{display:grid;gap:8px}
.stage{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--paper);border-radius:4px;padding:10px 12px;cursor:pointer;min-height:44px}
.stage.done{border-left-color:var(--ok)}
.stage:disabled{opacity:.45;cursor:not-allowed;border-left-color:var(--line)}
.stage .sn small{display:block;font-size:.75rem;color:var(--muted)}
.stars{font-size:1rem;color:var(--warn);white-space:nowrap;letter-spacing:.05em}
.setgrid{display:grid;gap:14px}
.oldhist summary{cursor:pointer;color:var(--accent);font-size:.85rem;margin-top:6px}

/* ===================================================================
   v1.6.0 外観：Android アプリの作法（上部アプリバー・下部ナビゲーション・ボトムシート）
   図案の主役は「マークシートの楕円」。学習ロードの各ステージを塗りつぶす楕円で表す。
   色は管理図の配色：中心線の青（主色）、管理限界の赤（不正解）、安定の緑（正解）、注意の琥珀（連続記録）。
   =================================================================== */
:root{--r-xl:24px;--r-lg:16px;--r-md:12px;--r-sm:8px;--pri:var(--accent);--on-pri:#fff;--pri-c:#d3e7f0;--on-pri-c:#0d3a4f;--surf2:#e9efed;--elev:0 1px 2px rgba(16,40,52,.08),0 2px 8px rgba(16,40,52,.06);--nav-h:72px;--flame:#c77412}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--hero-bg:#1b4256;--hero-fg:#e6f2f7;--pri-c:#1d3a48;--on-pri:#06212d;--on-pri-c:#cfe6f2;--surf2:#1d292e;--elev:0 1px 2px rgba(0,0,0,.4);--flame:#f0a43a}}
:root[data-theme="dark"]{--hero-bg:#1b4256;--hero-fg:#e6f2f7;--pri-c:#1d3a48;--on-pri:#06212d;--on-pri-c:#cfe6f2;--surf2:#1d292e;--elev:0 1px 2px rgba(0,0,0,.4);--flame:#f0a43a}
html{-webkit-tap-highlight-color:transparent;font-size:calc(16px * var(--fs,1))}
/* 数字は桁がそろう等幅の数字にする（書体は本文と同じ） */
body{font-variant-numeric:tabular-nums}
body{font-size:calc(15px * var(--fs,1));-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
.wrap{padding-block:8px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
body.focus .wrap{padding-bottom:calc(190px + env(safe-area-inset-bottom,0px))}
h2{font-family:var(--f-body);font-size:1.05rem;font-weight:700;margin:28px 4px 10px;letter-spacing:.02em}
.lbl{letter-spacing:.04em;font-size:.75rem}
.panel{border-radius:var(--r-lg);border-color:transparent;box-shadow:var(--elev);padding:18px}
.note{line-height:1.6}
/* アプリバー */
header.appbar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-top:env(safe-area-inset-top,0px)}
header.appbar .bar{max-width:760px;margin:0 auto;height:60px;padding:0 8px 0 16px;display:flex;align-items:center;gap:6px}
.brandmark{width:28px;height:28px;flex:none;color:var(--pri)}
.brand{font-family:var(--f-body);font-weight:700;font-size:1.08rem;letter-spacing:.02em;margin:0 auto 0 6px;white-space:nowrap}
.iconbtn{width:48px;height:48px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.iconbtn:hover{background:var(--surf2)}
.iconbtn svg,.bnav svg,.tile svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.streakbtn{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 12px 0 8px;border-radius:999px;border:0;background:transparent;font-family:var(--f-num);font-weight:600;font-size:1rem;color:var(--muted);cursor:pointer}
.streakbtn svg{width:22px;height:22px;fill:currentColor;stroke:none}
.streakbtn.on{color:var(--flame)}
/* 下部ナビゲーション */
nav.bnav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--card);box-shadow:0 -1px 0 var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bnav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
nav.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:var(--muted);font-size:.72rem;font-weight:700;padding:0}
nav.bnav .pill{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;transition:background .2s}
nav.bnav button[aria-selected="true"]{color:var(--ink)}
nav.bnav button[aria-selected="true"] .pill{background:var(--pri-c);color:var(--on-pri-c)}
body.focus nav.bnav{display:none}
/* ボタン類 */
.btn{border-radius:999px;min-height:48px;padding:10px 22px;letter-spacing:.02em;border:0}
.btn.ghost{border:1px solid var(--line);color:var(--pri);background:var(--card)}
.btn.tonal{background:var(--pri-c);color:var(--on-pri-c)}
.btn.danger{border:1px solid var(--ucl)}
.btn.sm{min-height:36px;padding:4px 14px}
.btn.block{width:100%}
.btn:active:not(:disabled){transform:scale(.98)}
.seg{border-radius:999px;border-color:var(--line);background:var(--card)}
.seg button{padding:9px 16px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--pri-c);color:var(--on-pri-c)}
.chip{border-radius:var(--r-sm);padding:8px 12px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--pri-c);color:var(--on-pri-c);border-color:transparent}
/* サブタブ（演習：分野別／模擬試験、資料：資料／数値表） */
.subtabs{display:flex;gap:4px;padding:4px;margin:8px 0 4px;background:var(--surf2);border-radius:999px}
.subtabs button{flex:1;border:0;background:none;border-radius:999px;min-height:40px;font-weight:700;color:var(--muted);cursor:pointer}
.subtabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--elev)}
/* ホーム：今日のカード */
.hero{background:var(--hero-bg,var(--pri));color:var(--hero-fg,#fff);border-radius:var(--r-xl);padding:20px;margin-top:12px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px);background-size:16px 16px;pointer-events:none}
.hero>*{position:relative}
.hero .exam{font-size:.85rem;opacity:.9}
.hero .days{font-family:var(--f-num);font-size:3rem;font-weight:600;line-height:1;letter-spacing:-.02em}
.hero .days small{font-family:var(--f-body);font-size:1rem;font-weight:700;margin-left:4px;letter-spacing:0}
.hero .sub{font-size:.78rem;opacity:.85;margin-top:4px}
.hero .row{display:flex;align-items:center;gap:16px}
.ring{width:96px;height:96px;flex:none;margin-left:auto}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:color-mix(in srgb,currentColor 22%,transparent)}.ring .fg{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring text{fill:currentColor;font-family:var(--f-num);font-weight:600;text-anchor:middle}
.hero .goalline{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:10px;font-size:.88rem}
.hero .goalline svg{width:22px;height:22px;fill:currentColor;flex:none}
.week{gap:8px;margin-top:4px}
.day{border:0;background:var(--surf2);border-radius:var(--r-md);padding:6px 0}
.day.ok{background:var(--ok);color:#fff}.day.ok .w{color:rgba(255,255,255,.85)}
.day.fz{background:var(--pri-c);color:var(--on-pri-c)}
.day.today{outline:2px solid var(--pri);outline-offset:2px}
/* ホーム：続きから・タイル */
.cont{display:flex;gap:14px;align-items:center;cursor:pointer;width:100%;text-align:left;border:0;font:inherit;color:inherit}
.cont .oval{flex:none}
.cont .t{font-weight:700;font-size:1rem}.cont .s{font-size:.8rem;color:var(--muted)}
.cont .go{margin-left:auto;color:var(--pri)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border:0;border-radius:var(--r-lg);background:var(--card);box-shadow:var(--elev);cursor:pointer;text-align:left;min-height:112px;color:var(--ink);font:inherit}
.tile .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pri-c);color:var(--on-pri-c)}
.tile b{font-size:.95rem}.tile span.sub{font-size:.75rem;color:var(--muted);line-height:1.4}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile:active:not(:disabled){transform:scale(.98)}
.kpi{border-left:0;text-align:center}
.kpi .v{font-size:1.6rem}
/* 学習ロード：マークシートの楕円が連なる道 */
.chapband{border-radius:var(--r-lg);padding:16px 18px;margin:24px 0 8px;background:var(--card);box-shadow:var(--elev);border-left:6px solid var(--pri)}
.chapband.done{border-left-color:var(--ok)}.chapband.locked{border-left-color:var(--line)}
.chapband .no{font-size:.78rem;color:var(--muted);font-weight:700}
.chapband .tt{font-size:1.1rem;font-weight:700;margin:2px 0}
.chapband .rl{font-size:.8rem;color:var(--muted)}
.chapband details summary{cursor:pointer;color:var(--pri);font-size:.82rem;font-weight:700;margin-top:6px;list-style:none}
.chapband details summary::-webkit-details-marker{display:none}
.trail{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0 4px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;cursor:pointer;font:inherit;color:inherit;padding:4px}
.oval{width:76px;height:54px;border-radius:50%;border:3px solid var(--pri);display:grid;place-items:center;background:var(--card);color:var(--pri);font-family:var(--f-num);font-weight:600;font-size:1.15rem;box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 35%,transparent);transition:transform .1s}
.node:active .oval{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--pri) 35%,transparent)}
.oval svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.node.done .oval{background:var(--ink);border-color:var(--ink);color:var(--paper);box-shadow:0 4px 0 color-mix(in srgb,var(--ink) 40%,transparent)}
.node.cur .oval{background:var(--pri);color:var(--on-pri);animation:breathe 2.4s ease-in-out infinite}
.node.locked{cursor:pointer}.node.locked .oval{border-style:dashed;border-color:var(--line);color:var(--muted);box-shadow:none;background:transparent}
.node .nm{font-size:.78rem;font-weight:700;max-width:11em;text-align:center;line-height:1.35}
.node.locked .nm{color:var(--muted);font-weight:400}
.node .st{font-size:.8rem;color:var(--flame);letter-spacing:.08em;min-height:1em}
.node.test .oval{width:120px;border-radius:999px;font-family:var(--f-body);font-size:.85rem}
@keyframes breathe{0%,100%{box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 35%,transparent),0 0 0 0 color-mix(in srgb,var(--pri) 30%,transparent)}50%{box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 35%,transparent),0 0 0 10px transparent}}
.rolebar{display:flex;align-items:center;gap:12px}
.rolebar .meter{flex:1;height:8px;border-radius:999px}
.rolebar .meter::after{display:none}
.rolebar .meter i{border-radius:999px;background:var(--ok)}
/* 問題画面：集中モード */
.qtop{display:flex;align-items:center;gap:8px;margin:4px -8px 8px}
.qtop .prog{flex:1;height:12px;border-radius:999px;margin:0;background:var(--surf2)}
.qtop .prog i{border-radius:999px;background:var(--ok)}
.qtop .cnt{font-family:var(--f-num);font-size:.85rem;color:var(--muted);min-width:3.5em;text-align:right}
.qcard{background:transparent;box-shadow:none;padding:4px 0}
.qtext{font-size:1.05rem;line-height:1.8}
.opt{border-radius:var(--r-md);border:2px solid var(--line);border-bottom-width:4px;padding:12px 14px;min-height:56px;background:var(--card)}
.opt .bub{width:32px;height:24px}
.opt.sel{background:var(--pri-c);border-color:var(--pri);box-shadow:none}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--ucl)}
.fb{border-radius:var(--r-lg);border-width:0;padding:16px 18px}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:16;background:var(--card);box-shadow:0 -1px 0 var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));transition:background .2s}
.actionbar .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;align-items:stretch;gap:10px}
.actionbar .in.row{flex-direction:row;align-items:center}
.actionbar .in>.btn{width:100%;min-height:52px;font-size:1rem}
.actionbar .in.row>.btn{width:auto}
.actionbar .in.row>.btn.block{flex:1}
.actionbar .msg{flex:1;min-width:0;font-weight:700;font-size:1.05rem;display:flex;align-items:center;gap:10px}
.actionbar .msg .mk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#fff;flex:none;font-size:1.1rem}
.actionbar .btn{min-width:150px}
.actionbar.ok{background:var(--ok-soft)}.actionbar.ok .msg{color:var(--ok)}.actionbar.ok .mk{color:var(--ok)}
.actionbar.ng{background:var(--ucl-soft)}.actionbar.ng .msg{color:var(--ucl)}.actionbar.ng .mk{color:var(--ucl)}
.actionbar.ok .btn{background:var(--ok)}.actionbar.ng .btn{background:var(--ucl)}
.actionbar .btn.ghost{min-width:0}

.mockhead{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.mockhead .timer{margin-left:auto;padding:6px 14px;border-radius:999px;background:var(--surf2)}
/* ボトムシート */
#scrim{position:fixed;inset:0;z-index:19;background:rgba(10,20,26,.45);animation:fade .2s}
.sheet{border-top:0;border-radius:28px 28px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.18);padding-top:8px;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 10px}
.sheethead{margin-bottom:12px}
.sheethead strong{font-size:1.15rem}
@keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 設定の行 */
.srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .t{flex:1;min-width:0}.srow .t b{display:block;font-size:.95rem}.srow .t span{display:block;font-size:.78rem;color:var(--muted);line-height:1.45}
.srow.col{flex-direction:column;align-items:stretch}
.switch{position:relative;width:52px;height:32px;flex:none;border:0;border-radius:999px;background:var(--surf2);box-shadow:inset 0 0 0 2px var(--muted);cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:8px;left:8px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:all .2s}
.switch[aria-checked="true"]{background:var(--pri);box-shadow:none}
.switch[aria-checked="true"]::after{left:24px;top:4px;width:24px;height:24px;background:var(--on-pri)}
select,input[type=time],input[type=date]{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;min-height:44px}
.setcard{background:var(--paper);border-radius:var(--r-lg);padding:4px 16px;margin-bottom:12px}
.setcard h3{font-size:.8rem;color:var(--pri);margin:12px 0 0}
#toast{bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom,0px));border-radius:var(--r-sm);padding:12px 18px;box-shadow:0 4px 16px rgba(0,0,0,.25)}
body.focus #toast{bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.appfoot{border-top:0}
@media (prefers-reduced-motion:reduce){.node.cur .oval{animation:none}}
/* 見やすさ・押しやすさ：操作部品は 44px 以上 */
.btn.sm{min-height:44px}
.chip,.seg button,.subtabs button{min-height:44px}
.streakbtn{height:44px}
.linkbtn{min-height:44px;display:inline-flex;align-items:center}
.chapband details summary,.oldhist summary,.syl summary{min-height:44px;display:flex;align-items:center}
.lnk a{display:inline-flex;align-items:center;min-height:44px}
.switch,.blank2,.qgrid button{position:relative}
.switch::before{content:"";position:absolute;inset:-8px -4px}
button.blank2{min-height:40px}button.blank2::before{content:"";position:absolute;inset:-4px 0}
.qgrid button{min-height:40px}.qgrid button::before{content:"";position:absolute;inset:-2px}
/* ホーム：主ボタン・一覧 */
.primary{display:flex;align-items:center;gap:14px;width:100%;margin-top:16px;padding:18px;border:0;border-radius:var(--r-lg);background:var(--pri);color:var(--on-pri);font:inherit;text-align:left;cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--pri) 55%,#000)}
.primary:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--pri) 55%,#000)}
.primary .ic,.resume .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}
.primary svg,.resume svg,.lrow svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.primary b{display:block;font-size:1.1rem}.primary span span{font-size:.82rem;opacity:.9}.primary .go{margin-left:auto}
.resume{border:2px solid var(--pri);margin-top:12px}.resume .ic{background:var(--pri-c);color:var(--on-pri-c)}
.panel.list{padding:4px 0}
.lrow{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:10px 16px;border:0;background:none;color:var(--ink);font:inherit;text-align:left;cursor:pointer;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}.lrow>span:nth-child(2){flex:1;min-width:0}.lrow b{display:block}.lrow span span{font-size:.8rem;color:var(--muted)}
.lrow .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--pri-c);color:var(--on-pri-c);flex:none}
.lrow>svg{color:var(--muted)}
/* 解説：要点と詳しく */
.fb .key{font-weight:700;margin:2px 0 4px}
.more summary{cursor:pointer;color:var(--pri);font-weight:700;font-size:.88rem;padding:6px 0;min-height:44px;display:flex;align-items:center;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::after{content:"＋";margin-left:6px}.more[open] summary::after{content:"−"}
.more p{margin:0 0 6px}
/* 問題の切り替え */
.qcard.enter{animation:slidein .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slidein{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
/* レッスン終了画面 */
.result{text-align:center;padding:24px 16px 16px;margin-top:12px;border-radius:var(--r-xl);background:var(--card);box-shadow:var(--elev)}
.rring svg{width:132px;height:132px;display:block;margin:0 auto}
.rring circle{fill:none;stroke-width:12}.rring .bg{stroke:var(--surf2)}.rring .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.result.bad .rring .fg{stroke:var(--flame)}
.rring text{font-size:32px;font-weight:700;fill:var(--ink)}
.rtitle{font-size:1.4rem;font-weight:700;margin-top:8px}.result.good .rtitle{color:var(--ok)}.result.bad .rtitle{color:var(--flame)}
.rsub{font-size:.85rem;color:var(--muted)}
.rstats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rstats div{background:var(--paper);border-radius:var(--r-md);padding:10px 4px}
.rstats span{display:block;font-size:.72rem;color:var(--muted)}.rstats b{font-size:1.25rem}.rstats small{font-size:.7rem;font-weight:400;color:var(--muted)}
.ractions{display:grid;gap:10px;margin-top:16px}
/* 電卓 */
.cdisp{position:relative;background:var(--paper);border-radius:var(--r-md);padding:10px 14px;margin-bottom:10px;text-align:right;min-height:84px}
.cexp{font-size:1rem;color:var(--muted);min-height:1.6em;overflow-wrap:anywhere}
.cres{font-size:2rem;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.cmem{position:absolute;left:12px;top:8px;font-size:.75rem;color:var(--pri);font-weight:700}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ck{min-height:52px;border-radius:var(--r-md);border:0;font:inherit;font-size:1.15rem;font-weight:700;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:var(--elev)}
.ck.op{background:var(--surf2)}.ck.eq{background:var(--pri);color:var(--on-pri);grid-row:span 2}
.ck:active{transform:scale(.97)}
#calc .in{max-width:420px}
/* 数値表の強調 */
table.nt td.hl,table.nt th.hl{background:var(--ucl);color:#fff;font-weight:700;border-radius:3px}
table.nt tr.hlrow td,table.nt tr.hlrow th{background:var(--ucl-soft)}
/* 初回の案内 */
#onb{position:fixed;inset:0;z-index:40;background:var(--paper);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(120px + env(safe-area-inset-bottom,0px))}
body.onbopen{overflow:hidden}
.oin{max-width:560px;margin:0 auto}
.odots{display:flex;gap:6px;justify-content:center;margin:8px 0 4px}.odots i{width:28px;height:6px;border-radius:3px;background:var(--line)}.odots i.on{background:var(--pri)}
.oskip{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;border:0;background:none;color:var(--muted);font:inherit;padding:10px;cursor:pointer}
.obody{padding-top:16px}
.ohero{display:grid;place-items:center;margin:24px 0 8px}.ohero .brandmark{width:96px;height:96px;border-radius:24px}
.otitle{font-size:1.35rem;margin:12px 0 8px;text-align:left}
.olist{list-style:none;padding:0;margin:16px 0;display:grid;gap:12px}.olist li{background:var(--card);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--elev)}
.olist b{display:block;margin-bottom:2px}.olist span{font-size:.88rem;color:var(--muted)}
.ocards{display:grid;gap:10px;margin-top:14px}
.ocard{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px 16px;border-radius:var(--r-lg);border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;min-height:60px}
.ocard span{font-size:.82rem;color:var(--muted)}
.ocard[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-c);color:var(--on-pri-c)}.ocard[aria-pressed="true"] span{color:inherit;opacity:.85}
.opreview{margin:10px 0 0;padding:12px;border-radius:var(--r-md);background:var(--card);font-size:1.05rem;line-height:1.8}
#onb .actionbar{z-index:41}
/* 解説の図 */
.qfig{margin:12px 0 4px;padding:10px 10px 8px;background:var(--card);border-radius:var(--r-md);color:var(--ink)}
.qfig svg{display:block;width:100%;height:auto;max-height:240px}
.qfig text{font-family:var(--f-body);font-size:10.5px;fill:var(--muted)}
.qfig figcaption{font-size:.8rem;color:var(--muted);line-height:1.6;margin-top:4px}
.f-line{fill:none;stroke:var(--pri);stroke-width:2.4;stroke-linejoin:round}.f-line.thin{stroke-width:1.6}
.f-axis{stroke:var(--muted);stroke-width:1.2}.f-dash{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.f-dash2{stroke:var(--pri);stroke-width:1.4;stroke-dasharray:4 3}
.f-mark{stroke:var(--ucl);stroke-width:2}.f-mark2{stroke:var(--ok);stroke-width:2}
.f-hl{fill:var(--ucl);opacity:.28}.f-hlt{fill:var(--ucl)!important;font-weight:700}.f-okt{fill:var(--ok)!important;font-weight:700}.f-pri{fill:var(--pri)!important;font-weight:700}
.f-ucl{stroke:var(--ucl);stroke-width:1.4;stroke-dasharray:6 4}.f-cl{stroke:var(--pri);stroke-width:1.4}
.f-pt{fill:var(--pri)}.f-out{fill:var(--ucl)}.f-bar{fill:var(--pri);opacity:.75}.f-box{fill:var(--pri-c);stroke:var(--pri);stroke-width:1.6}
.f-box+text{fill:var(--on-pri-c)!important;font-weight:700;font-size:13px!important}
/* 大問：本文中の空欄ボタン */
.qtext.dai{line-height:2.3}
.blank2{display:inline-flex;align-items:baseline;gap:4px;flex-wrap:wrap;vertical-align:baseline;margin:0 2px;padding:1px 10px;min-height:34px;border:2px dashed var(--muted);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer;line-height:1.5}
.blank2 b{color:var(--muted);font-weight:700}
.blank2.filled{border-style:solid;border-color:var(--pri);background:var(--pri-c);color:var(--on-pri-c)}
.blank2.filled b{color:inherit}
.blank2.act{border-style:solid;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 30%,transparent)}
.blank2.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.blank2.ng{border-style:solid;border-color:var(--ucl);background:var(--ucl-soft);color:var(--ucl)}
.blank2 .fix{color:var(--ok);font-weight:700}
.blank2:disabled{cursor:default}
.ghint{position:sticky;top:60px;z-index:2;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;padding:8px 12px;margin:4px 0 10px;border-radius:var(--r-md);background:var(--surf2);font-size:.88rem}
.ghint span{margin-left:auto;font-family:var(--f-num);color:var(--muted);font-size:.8rem}
.opt .used{display:block;font-size:.72rem;color:var(--pri);font-weight:700}
.oxlist{display:grid;gap:10px;margin-top:6px}
.oxrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:12px;border-radius:var(--r-md);background:var(--card);border:2px solid var(--line)}
.oxrow.ok{border-color:var(--ok)}.oxrow.ng{border-color:var(--ucl)}
.oxrow .t{font-size:.95rem;line-height:1.7}
.oxbtns{display:flex;gap:6px}
.oxb{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-size:1.25rem;font-weight:700;cursor:pointer;color:var(--ink)}
.oxb.on{border-color:var(--pri);background:var(--pri-c);color:var(--on-pri-c)}
.oxb.right{border-color:var(--ok);background:var(--ok);color:#fff}
.oxb.wrong{border-color:var(--ucl);background:var(--ucl-soft);color:var(--ucl)}
.gex{padding:8px 0;border-top:1px dashed color-mix(in srgb,currentColor 25%,transparent)}
.gex b{display:block}.gex.ok b{color:var(--ok)}.gex.ng b{color:var(--ucl)}
.gex p{margin:2px 0 0;color:var(--ink)}
.cont{background:none;padding:0}
.crit>div{border:0;background:var(--surf2);border-radius:var(--r-md)}
.crit div div{border:0;padding:0;background:none}
.sheet .crit{margin-top:4px}
</style>

// 選択肢を作る：正解の大小順位（最小〜最大）を毎回ランダムに決め、その順位になるように誤答を選ぶ。
// 誤答は「よくある計算ミス」の候補を優先し、足りない側は正解から8〜50%ずらした近傍値で補う。
function mc(ans,wrong,fmt){
  const A=fmt(ans),set=new Set([A]);
  const dec=(String(A).match(/\.(\d+)/)||['',''])[1].length,step=10**-dec;
  const lo=[],hi=[];
  for(const w of wrong){if(w==null||!isFinite(w))continue;const s=fmt(w);if(set.has(s))continue;set.add(s);(w<ans?lo:hi).push([w,s]);}
  // 値域の推定：正解と誤答候補がすべて0〜1なら確率とみなし、近傍値も0〜1に収める
  const all=[ans,...lo.map(x=>x[0]),...hi.map(x=>x[0])];
  const prob=all.every(v=>v>=0&&v<=1),pos=ans>0;
  const near=(side,base=ans)=>{for(let t=0;t<40;t++){
      const d=0.08+Math.random()*0.42;let v=base*(1+side*d);
      if(Math.abs(v-ans)<step)v=ans+side*step*(1+Math.floor(Math.random()*3));
      if(prob&&v>=1)v=base+(1-base)*(0.2+Math.random()*0.7);if(pos&&v<=0)v=base*(0.2+Math.random()*0.6);
      if(Math.abs(v-ans)<step*0.5)continue;
      const s=fmt(v);if(!set.has(s)){set.add(s);return[v,s];}}
    return null;};
  const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  shuffle(lo);shuffle(hi);
  // 目標の順位 r：正解より小さい誤答の数（0〜3）
  const order=shuffle([0,1,2,3]);
  for(const r of order){
    const L=lo.slice(0,r),H=hi.slice(0,3-r);
    // 近傍値は外側へ連ねて作る（正解のまわりに誤答が集まり、真ん中の値が正解だと見抜かれるのを防ぐ）
    while(L.length<r){const b=Math.min(ans,...L.map(x=>x[0]));const x=near(-1,b);if(!x)break;L.push(x);}
    while(H.length<3-r){const b=Math.max(ans,...H.map(x=>x[0]));const x=near(1,b);if(!x)break;H.push(x);}
    if(L.length===r&&H.length===3-r)return[A,...L.map(x=>x[1]),...H.map(x=>x[1])];
  }
  // どの順位でも作れない場合（値域が狭いなど）は、作れたものから4つにする
  const out=[A,...lo.map(x=>x[1]),...hi.map(x=>x[1])];
  while(out.length<4){const x=near(out.length%2?1:-1)||near(1)||near(-1);if(!x)break;out.push(x[1]);}

// ===== 共通 =====
// 試験回：公式に発表された回（res.js の EXAMS）から選ぶか、日付を自分で指定する（端末ごとに保存）
function examSel(){let id='auto',d='';try{id=localStorage.getItem('qc2-exam')||'auto';d=localStorage.getItem('qc2-exam-date')||'';}catch(e){}return{id,d};}
function curExam(){
  const {id,d}=examSel(),today=dayKey(new Date());
  if(id==='custom')return d?{label:'試験日',date:d,custom:true}:null;
  if(id==='none')return null;
  const e=EXAMS.find(x=>x.id===id)||EXAMS.find(x=>x.date>=today);
  return e||null;
}
const daysTo=date=>Math.ceil((new Date(date+'T00:00:00')-new Date(dayKey(new Date())+'T00:00:00'))/864e5);
const md=d=>{const [y,m,dd]=d.split('-');return `${+m}/${+dd}`;};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=5381;for(const c of s)h=(h*33+c.charCodeAt(0))>>>0;return 'k'+h.toString(36);};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const BUB='①②③④⑤';
const KANA='アイウエオカキクケコサシスセソタチツテト';
const OXL=['○','×'];
// 全問題の索引（知識問題はハッシュID、計算問題はジェネレータID、本試験形式は「セットID-空欄番号」）
const ITEMS=[];
// 問題文を直した問題は、元の問題文から作ったID（5番目の要素）を使い、進捗を引き継ぐ
KB.forEach(([cat,q,ch,ex,id])=>ITEMS.push({id:id||hash(q),cat,kind:'k',q,ch,ex}));
Object.entries(G).forEach(([id,g])=>ITEMS.push({id,cat:g.cat,kind:'g'}));
const SETS={};
DAI.forEach(s=>{
  const ids=[];
  if(s.type==='ox')s.items.forEach(([t,ok,ex,cat],k)=>{const id=s.id+'-'+(k+1);ids.push(id);ITEMS.push({id,cat:cat||s.cat,kind:'x',set:s.id,k,ox:true,t,ok,ex});});
  else s.ans.forEach((a,k)=>{const id=s.id+'-'+(k+1);ids.push(id);ITEMS.push({id,cat:s.cat,kind:'x',set:s.id,k,a,ex:s.ex[k]});});
  SETS[s.id]={...s,ids,field:CATS[s.cat].field};
});
const BYID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
// 出題範囲（レベル表）の各項目に、該当する問題IDを割り当てる
function itemText(i){
  if(i.kind==='k')return i.q+' '+i.ch.join(' ')+' '+i.ex;
  if(i.kind==='x'){const s=SETS[i.set];return i.ox?i.t+' '+i.ex:s.stem+' '+s.opts[i.a]+' '+i.ex;}
  return '';
}
const SYLX=SYL.flatMap((g,gi)=>g.items.map(([name,lv,re,gens,tag],ii)=>({key:gi+'-'+ii,f:g.f,h:g.h,gtag:g.tag,lv3:!!(g.lv3||g.lv),name,lv,tag,
  ids:ITEMS.filter(x=>CATS[x.cat].field===g.f&&(x.kind==='g'?(gens||[]).includes(x.id):re.test(itemText(x)))).map(x=>x.id)})));
// 本試験形式の問題文：対象の空欄を強調し、他の空欄は番号だけ表示する
function daiText(it,html){
  const s=SETS[it.set];
  if(it.ox){const t=`${s.stem}\n（${it.k+1}）${it.t}`;return html?esc(t):t;}
  const src=html?esc(s.stem):s.stem;
  return src.replace(/\{(\d+)\}/g,(m,n)=>+n===it.k+1?(html?`<mark class="blank">（${n}）</mark>`:`【（${n}）】`):`（${n}）`);
}
// 出題インスタンスを作る（選択肢はシャッフルし、正解インデックスを保持。本試験形式は選択肢群の順序を保つ）
function instance(it){
  if(it.kind==='x'){
    const s=SETS[it.set];
    return{id:it.id,cat:it.cat,kind:'x',set:it.set,k:it.k,ox:!!it.ox,q:daiText(it,false),qhtml:daiText(it,true),ex:it.ex,
      choices:it.ox?['正しい','誤り']:s.opts.slice(),ans:it.ox?(it.ok?0:1):it.a,pick:null};
  }
  let q,ch,ex;
  if(it.kind==='k'){q=it.q;ch=it.ch;ex=it.ex;}else{const r=G[it.id].f();q=r.q;ch=r.ch;ex=r.ex;}
  const order=shuffle(ch.map((c,i)=>i));
  return{id:it.id,cat:it.cat,kind:it.kind,q,ex,choices:order.map(i=>ch[i]),ans:order.indexOf(0),pick:null};
}
const labOf=it=>it.kind==='x'?(it.ox?OXL:KANA):BUB;
// 本試験形式：セット単位で選び、空欄の順序を保って出題する（target 問に達するまでセットを足す）
function buildSets(pool,target,weakFirst){
  const ids=new Set(pool.map(i=>i.id));
  let sets=shuffle([...new Set(pool.map(i=>i.set))]);
  if(weakFirst){const w=new Set(weakIds().map(id=>BYID[id]&&BYID[id].set));sets.sort((a,b)=>(w.has(b)?1:0)-(w.has(a)?1:0));}
  const out=[];
  for(const sid of sets){if(out.length>=target)break;SETS[sid].ids.filter(id=>ids.has(id)).forEach(id=>out.push(id));}
  return out.map(id=>instance(BYID[id]));
}
// 決まった問数ちょうどになるようにセットを選ぶ（模擬試験用）
function fitSets(pool,target){
  const out=[];
  for(const sid of shuffle([...new Set(pool.map(i=>i.set))])){const n=SETS[sid].ids.length;if(out.length+n<=target)SETS[sid].ids.forEach(id=>out.push(id));}
  return out;
}

// ===== 進捗の保存（アカウント保存 → 使えなければこの端末に保存） =====
const EMPTY=()=>({stats:{},sessions:[],mocks:[],reports:[],daily:{},goal:10,path:{},chap:{}});
let P=EMPTY();
const store={mode:'local',db:null,ref:null,busy:false,dirty:false};
function loadLocal(){try{const s=localStorage.getItem('qc2-progress');if(s)P=Object.assign(EMPTY(),JSON.parse(s));}catch(e){}}
function saveLocal(){try{localStorage.setItem('qc2-progress',JSON.stringify(P));}catch(e){}}
async function initStore(){
  loadLocal();render();
  try{
    const c=window.claude;if(!c||!c.use)return;
    const [db,user]=await Promise.all([c.use('db'),c.use('user')]);
    if(!db||!user)return;
    const uid=await user.id();if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/progress');
    const snap=await ref.get();
    if(snap.exists){const d=snap.data();P=Object.assign(EMPTY(),JSON.parse(JSON.stringify(d)));}
    else if(Object.keys(P.stats).length){await ref.set(JSON.parse(JSON.stringify(P)));}
    store.mode='cloud';store.db=db;store.ref=ref;saveLocal();syncNative();render();
  }catch(e){store.mode='local';}
}
// 書込みは1件ずつ。連続回答はまとめて1回の書込みにする
async function persist(){
  saveLocal();syncNative();
  if(store.mode!=='cloud')return;
  if(store.busy){store.dirty=true;return;}
  store.busy=true;
  try{do{store.dirty=false;await store.ref.set(JSON.parse(JSON.stringify(P)));}while(store.dirty);}
  catch(e){if(e&&e.code==='invalid_argument'){store.mode='local';render();}}
  finally{store.busy=false;}
}
function record(id,ok){
  const td=dayKey(new Date());P.daily=P.daily||{};P.daily[td]=(P.daily[td]||0)+1;
  const s=P.stats[id]||{c:0,w:0,s:0,t:0};
  if(ok){s.c++;s.s++;}else{s.w++;s.s=0;}
  s.t=Date.now();
  // 間隔反復：正解なら間隔を約2.5倍に延ばし（初回は1日）、不正解なら今日の復習に戻す
  const iv=ivOf(s,true);
  if(ok){s.iv=Math.min(120,iv?Math.round(iv*2.5):1);s.due=dayStart(s.t)+s.iv*864e5;}
  else{s.iv=0;s.due=s.t;}
  P.stats[id]=s;
}
// ===== 間隔反復 =====
const dayStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();};
// 以前の版の記録（間隔の情報なし）は、連続正解数から間隔を推定する
const IV0=[0,1,3,7,16,35];
function ivOf(s,before){if(s.iv!=null)return s.iv;return before?IV0[Math.min(s.s-(s.s>0?1:0),5)]:IV0[Math.min(s.s,5)];}
function dueOf(s){if(s.due!=null)return s.due;const iv=ivOf(s,false);return iv?dayStart(s.t)+iv*864e5:s.t;}
// 今日（今日の終わりまで）に復習する問題。期限を過ぎた順
function dueIds(){
  const end=dayStart(Date.now())+864e5;
  return Object.entries(P.stats).filter(([id,s])=>BYID[id]&&dueOf(s)<end).sort((a,b)=>dueOf(a[1])-dueOf(b[1])).map(([id])=>id);
}
// 定着度：間隔 21 日以上を「定着」、1〜20 日を「学習中」とする
function srsSummary(){
  const end=dayStart(Date.now())+864e5,r={due:0,tom:0,learn:0,firm:0};
  for(const [id,s] of Object.entries(P.stats)){if(!BYID[id])continue;const d=dueOf(s),iv=s.iv!=null?s.iv:ivOf(s,false);
    if(d<end)r.due++;else if(d<end+864e5)r.tom++;if(iv>=21)r.firm++;else r.learn++;}
  return r;
}
// 苦手：一度でも間違え、まだ2連続正解していない問題
const weakIds=()=>Object.entries(P.stats).filter(([id,s])=>BYID[id]&&s.w>0&&s.s<2).sort((a,b)=>(b[1].w-b[1].c)-(a[1].w-a[1].c)).map(([id])=>id);
function catAcc(){
  const r={};for(const k in CATS)r[k]={c:0,n:0};
  for(const [id,s] of Object.entries(P.stats)){const it=BYID[id];if(!it)continue;r[it.cat].c+=s.c;r[it.cat].n+=s.c+s.w;}
  return r;
}
function fieldAcc(){const a=catAcc(),f={'手法':{c:0,n:0},'実践':{c:0,n:0}};for(const k in a){f[CATS[k].field].c+=a[k].c;f[CATS[k].field].n+=a[k].n;}return f;}
const pct=(c,n)=>n?Math.round(c/n*100):null;

// ===== 連続記録 =====
// 端末の日付（日本では JST）で集計する。1日の目標問題数を解いた日を「達成日」とする。
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
// 日別の記録を古い順にたどって、連続日数・最長記録・記録の保護（7日連続ごとに1回、最大2回。達成できなかった日を1日だけ埋める）を求める
function streakInfo(){
  const D=P.daily||{},goal=P.goal||10,today=new Date(),tk=dayKey(today);
  const keys=Object.keys(D).filter(k=>D[k]>0).sort();
  const res={cur:0,best:0,freeze:0,today:D[tk]||0,goal,done:(D[tk]||0)>=goal,used:new Set()};
  if(!keys.length)return res;
  let d=new Date(keys[0]+'T00:00:00'),cur=0,freeze=0;
  while(dayKey(d)<tk){
    const k=dayKey(d);
    if((D[k]||0)>=goal){cur++;if(cur%7===0)freeze=Math.min(2,freeze+1);}
    else if(cur>0&&freeze>0){freeze--;res.used.add(k);}
    else cur=0;
    res.best=Math.max(res.best,cur);d=addDays(d,1);
  }
  if(res.done)cur++;
  res.cur=cur;res.best=Math.max(res.best,cur);res.freeze=freeze;return res;
}
// 直近7日の達成状況（✓達成・◆保護で継続・空欄）
function weekHTML(st){
  const D=P.daily||{},t=new Date(),W='日月火水木金土';
  return `<div class="week">${[...Array(7)].map((_,i)=>{const d=addDays(t,i-6),k=dayKey(d),n=D[k]||0,ok=n>=st.goal,fz=st.used.has(k),isT=i===6;
    return `<div class="day ${ok?'ok':fz?'fz':''} ${isT?'today':''}" title="${k}：${n}問"><span class="w">${W[d.getDay()]}</span><span class="m">${ok?'✓':fz?'◆':isT?n:''}</span></div>`;}).join('')}</div>`;
}
function syncStreakChip(){const st=streakInfo(),c=$('#streakChip');if(!c)return;c.innerHTML=ICON.flame+st.cur;c.classList.toggle('on',st.done);c.setAttribute('aria-label',`連続 ${st.cur} 日${st.done?'（今日は達成）':''}`);}
function streakSheet(){
  const st=streakInfo();
  openG(`<div class="sheethead"><strong>連続 ${st.cur} 日</strong><button class="iconbtn" data-close aria-label="閉じる">${ICON.close}</button></div>
  ${weekHTML(st)}
  <div class="crit"><div><div class="lbl">今日</div><div class="v">${st.today}／${st.goal}</div></div><div><div class="lbl">最長記録</div><div class="v">${st.best}日</div></div><div><div class="lbl">記録の保護</div><div class="v">${st.freeze}</div></div></div>
  <p class="note">1日の目標（${st.goal}問）を解いた日が1日に数えられます。7日続けるごとに「記録の保護」が1つ（最大2つ）たまり、できなかった日を1日だけ埋めます。目標の問題数は設定で変えられます。</p>`);
}

// ===== 学習ロード =====
const STAGES={};
PATH.forEach((ch,ci)=>ch.stages.forEach((sg,si)=>{
  const ids=new Set();
  if(sg.groups)SYLX.filter(x=>sg.groups.includes(x.h)).forEach(x=>x.ids.forEach(id=>ids.add(id)));
  if(sg.cats)ITEMS.filter(x=>sg.cats.includes(x.cat)&&x.kind!=='x').forEach(x=>ids.add(x.id));
  if(sg.sets)ITEMS.filter(x=>x.kind==='x'&&sg.sets.includes(x.set)).forEach(x=>ids.add(x.id));
  if(sg.kind)ITEMS.filter(x=>x.kind===sg.kind).forEach(x=>ids.add(x.id));
  STAGES[sg.id]=Object.assign({},sg,{ch,ci,si,ids:[...ids]});
}));
const stars=id=>((P.path||{})[id]||{}).s||0;
const stageDone=id=>stars(id)>=PATH_RULE.starsToClear;
const chapDone=ch=>ch.final?(P.mocks||[]).some(m=>m.pass)&&!!(P.chap||{})[ch.id]:!!(P.chap||{})[ch.id];
// 章が開いているか：最初の章、または前の章を修了している
const chapOpen=ci=>ci===0||chapDone(PATH[ci-1]);
const stageOpen=st=>chapOpen(st.ci)&&(st.si===0||stageDone(st.ch.stages[st.si-1].id));
// 最終章は「全ステージ修了」で章末扱い、模擬試験の合格で修了
function finalReady(ch){return ch.stages.every(s=>stageDone(s.id));}
function curChapter(){const i=PATH.findIndex(ch=>!chapDone(ch));return i<0?PATH.length-1:i;}
function nextStage(){const ch=PATH[curChapter()];return ch.stages.map(s=>STAGES[s.id]).find(s=>!stageDone(s.id)&&stageOpen(s))||null;}
const role=()=>{let r='見習い';PATH.forEach(ch=>{if(chapDone(ch))r=ch.role;});return r;};
// レッスンの出題：まだ解いていない問題→苦手→その他の順に優先する
function lessonList(st,n){
  const pool=st.ids.map(id=>BYID[id]).filter(Boolean);
  if(pool.length&&pool.every(i=>i.kind==='x'))return buildSets(pool,n,true);
  // 優先順：今日の復習 → 未出題 → 苦手 → その他
  const dd=new Set(dueIds()),w=new Set(weakIds()),rank=it=>dd.has(it.id)?0:!P.stats[it.id]?1:w.has(it.id)?2:3;
  const ids=shuffle(pool.map(i=>i.id)).sort((a,b)=>rank(BYID[a])-rank(BYID[b])).slice(0,n);
  return shuffle(ids).map(id=>instance(BYID[id]));
}
// 出題リストの一部を今日の復習の問題に入れ替える（大問以外、最大 k 問）
function mixReview(list,k){
  const have=new Set(list.map(x=>x.id)),due=dueIds().map(id=>BYID[id]).filter(it=>it.kind!=='x'&&!have.has(it.id)).slice(0,k);
  due.forEach((it,i)=>{list[i]=instance(it);});return shuffle(list);
}
// 今日の復習：期限が来た問題を最大20問。大問の空欄は大問ごとまとめて出す
function startReview(){
  const all=dueIds().map(id=>BYID[id]),d=all.filter(it=>it.kind!=='x'),xs=all.filter(it=>it.kind==='x');
  const list=buildList(d,Math.min(20,d.length),false).concat(xs.length&&d.length<20?buildSets(xs,20-d.length,false):[]);
  if(list.length){quiz=null;startQuiz(list,'今日の復習');}
}
function startStage(id){const st=STAGES[id];if(!st||!stageOpen(st))return;quiz=null;startQuiz(lessonList(st,PATH_RULE.lesson),'ロード：'+st.name);quiz.stage=id;}
function startChapTest(ci){
  const ch=PATH[ci];if(ch.final){setView('mock');return;}
  const pool=[...new Set(ch.stages.flatMap(s=>STAGES[s.id].ids))].map(id=>BYID[id]).filter(it=>it&&it.kind!=='x');
  quiz=null;startQuiz(buildList(pool,PATH_RULE.testN,false),'章末テスト：'+ch.title);quiz.ctest=ci;
}
// レッスン・章末テストの終了時に呼ぶ。結果のメッセージを返す
function finishPath(){
  const n=quiz.list.length,r=quiz.correct/n;P.path=P.path||{};P.chap=P.chap||{};
  if(quiz.stage){
    const id=quiz.stage,o=P.path[id]||{s:0,b:0};o.b=Math.max(o.b,Math.round(r*100));
    const was=stageDone(id);
    if(r>=PATH_RULE.lessonPass){o.s=Math.min(3,o.s+1);P.path[id]=o;
      const now=stageDone(id);quiz.pathMsg=now&&!was?`ステージ「${STAGES[id].name}」をクリア！`:`★ を1つ獲得（${o.s}／${PATH_RULE.starsToClear}）`;}
    else{P.path[id]=o;quiz.pathMsg=`7割以上で ★ を獲得できます。もう一度挑戦しましょう。`;}
  }
  if(quiz.ctest!=null){
    const ci=quiz.ctest,ch=PATH[ci];
    if(r>=PATH_RULE.testPass){
      // 飛び級：合格した章より前の章もまとめて修了にする
      for(let i=0;i<=ci;i++){if(PATH[i].final)continue;P.chap[PATH[i].id]=true;PATH[i].stages.forEach(s=>{const o=P.path[s.id]||{s:0,b:0};if(o.s<PATH_RULE.starsToClear)o.s=PATH_RULE.starsToClear;P.path[s.id]=o;});}
      quiz.pathMsg=`${ch.title} 修了。称号「${ch.role}」を獲得しました。`;quiz.story=ch.clear;
    }else quiz.pathMsg=`合格は${PATH_RULE.testPass*100}%以上です。ステージで復習してから再挑戦しましょう。`;
  }
}

function ringSVG(v,goal){

function buildList(pool,n,weakFirst){
  if(pool.length&&pool.every(i=>i.kind==='x'))return buildSets(pool,n,weakFirst);
  let ids=shuffle(pool.map(i=>i.id));
  if(weakFirst){const w=new Set(weakIds());ids.sort((a,b)=>(w.has(b)?1:0)-(w.has(a)?1:0));}
  const out=ids.slice(0,n);const gens=pool.filter(i=>i.kind==='g');

}

// 本試験形式の大問：同じ大問の空欄が続く範囲 [s, e) を返す（大問以外は1問だけ）
function grpRange(list,i){

function groupCard(list,s,e,act,reveal,inDrill){

      return `<div class="gex ${ok?'ok':'ng'}"><b>（${it.k+1}）${ok?'✓':'✕'} 正答 ${L[it.ans]}${ox?'':' '+esc(S.opts[it.ans])}</b><p>${esc(it.ex)}</p></div>`;}).join('')}${figFor(S.title+' '+(S.stem||'')+' '+items.map(x=>x.ex).join(' '))}${refLine(items[0].cat)}${inDrill?reportBox(items[0]):''}</div>`:'';

function startMock(){
  const fld=(f,kind)=>ITEMS.filter(i=>i.kind===kind&&(kind==='x'?SETS[i.set].field:CATS[i.cat].field)===f);
  // 各分野の約半分を本試験形式の大問（セット単位で順序を保つ）にし、残りを計算・知識問題で埋める
  const mSet=fitSets(fld('手法','x'),Math.round(MOCK.method*.5));
  const pSet=fitSets(fld('実践','x'),Math.round(MOCK.practice*.5));
  const mRest=MOCK.method-mSet.length,ng=Math.round(mRest*.6),g=fld('手法','g');
  const mList=[...shuffle(g).concat(shuffle(g)).slice(0,ng),...shuffle(fld('手法','k')).slice(0,mRest-ng)];
  const pList=shuffle(fld('実践','k')).slice(0,MOCK.practice-pSet.length);
  const list=[...mSet.map(id=>BYID[id]),...shuffle(mList),...pSet.map(id=>BYID[id]),...pList].map(instance);
  mock={list,i:0,end:Date.now()+MOCK.min*60e3,done:false,confirm:false};
  tick();render();saveSession();
}

function trendSVG(){
  const s=P.sessions;if(s.length<2)return '<p class="empty">演習を2回以上行うと、正答率の推移が表示されます。</p>';
  const W=360,H=190,L=34,R=8,Tp=10,B=22,pb=s.reduce((a,x)=>a+x.c,0)/s.reduce((a,x)=>a+x.n,0);
  const x=i=>L+(W-L-R)*(s.length===1?0.5:i/(s.length-1)),y=v=>Tp+(H-Tp-B)*(1-v);
  const lim=s.map(o=>{const d=3*Math.sqrt(pb*(1-pb)/o.n);return[Math.min(1,pb+d),Math.max(0,pb-d)];});
  const step=(k)=>lim.map((l,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(l[k]).toFixed(1)}`).join('');
  const pts=s.map((o,i)=>[x(i),y(o.c/o.n),o.c/o.n<lim[i][1]]);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="正答率の推移">
  ${[0,.5,.7,1].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v*100}%</text>`).join('')}
  <path d="${step(0)}" fill="none" stroke="var(--ucl)" stroke-dasharray="4 3" stroke-width="1.2"/>
  <path d="${step(1)}" fill="none" stroke="var(--ucl)" stroke-dasharray="4 3" stroke-width="1.2"/>
  <line x1="${L}" x2="${W-R}" y1="${y(pb)}" y2="${y(pb)}" stroke="var(--accent)" stroke-width="1.2"/>
  <text x="${W-R}" y="${y(pb)-4}" text-anchor="end" style="fill:var(--accent)">CL ${Math.round(pb*100)}%</text>
  <polyline points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.5"/>
  ${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="${p[2]?'var(--ucl)':'var(--card)'}" stroke="${p[2]?'var(--ucl)':'var(--ink)'}" stroke-width="1.5"/>`).join('')}
  <text x="${L}" y="${H-6}">古い</text><text x="${W-R}" y="${H-6}" text-anchor="end">最新（${s.length}回）</text></svg>`;
}

function tablesHTML(where){
  const tabs=[['norm','正規分布'],['t','t 分布'],['chi2','χ² 分布'],['F05','F（5%）'],['F025','F（2.5%）'],['cc','管理図係数'],['sign','符号検定']];
  let body='';
  if(tableTab==='norm'){body=`<table class="nt"><thead><tr><th>K</th>${[...Array(10)].map((_,c)=>`<th>.0${c}</th>`).join('')}</tr></thead><tbody>${T.norm.map((r,i)=>`<tr><th>${(i/10).toFixed(1)}</th>${r.map(v=>`<td>${v.toFixed(4)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    body+='<p class="note">上側確率 P＝Pr(u≧K)。行がKの小数第1位まで、列が小数第2位。例：K＝1.96 → 0.0250。</p>';}
  if(tableTab==='t'){body=`<table class="nt"><thead><tr><th>φ ＼ P</th>${T.t.P.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>${T.t.df.map((d,i)=>`<tr><th>${d==='inf'?'∞':d}</th>${T.t.v[i].map(v=>`<td>${v.toFixed(3)}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="note">両側確率 P に対する t(φ, P)。片側 α の値は P＝2α の列を読む。</p>`;}
  if(tableTab==='chi2'){body=`<table class="nt"><thead><tr><th>φ ＼ P</th>${T.chi2.P.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>${T.chi2.df.map((d,i)=>`<tr><th>${d}</th>${T.chi2.v[i].map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="note">上側確率 P に対する χ²(φ, P)。</p>`;}
  if(tableTab==='F05'||tableTab==='F025'){const a=tableTab==='F05'?'0.05':'0.025';body=`<table class="nt"><thead><tr><th>φ2 ＼ φ1</th>${T.F.f1.map(f=>`<th>${f}</th>`).join('')}</tr></thead><tbody>${T.F.f2.map((f,i)=>`<tr><th>${f}</th>${T.F[a][i].map(v=>`<td>${v.toFixed(2)}</td>`).join('')}</tr>`).join('')}</tbody></table><p class="note">上側確率 ${a} の F(φ1, φ2)。φ1：分子の自由度、φ2：分母の自由度。</p>`;}
  if(tableTab==='cc'){body=`<table class="nt"><thead><tr><th>n</th><th>A2</th><th>D3</th><th>D4</th><th>d2</th><th>A3</th><th>B3</th><th>B4</th></tr></thead><tbody>${Object.entries(CC).map(([n,c])=>`<tr><th>${n}</th><td>${c.A2.toFixed(3)}</td><td>${c.D3==null?'—':c.D3.toFixed(3)}</td><td>${c.D4.toFixed(3)}</td><td>${c.d2.toFixed(3)}</td><td>${CS[n].A3.toFixed(3)}</td><td>${CS[n].B3==null?'—':CS[n].B3.toFixed(3)}</td><td>${CS[n].B4.toFixed(3)}</td></tr>`).join('')}</tbody></table><p class="note">X̄−R：X̿ ± A2R̄、UCL＝D4R̄、LCL＝D3R̄（n≦6は示さない）、σ̂＝R̄／d2。X̄−s：X̿ ± A3 s̄、UCL＝B4 s̄、LCL＝B3 s̄（n≦5は示さない）。</p>`;}
  if(tableTab==='sign'){const rows=[];for(let i=0;i<T.sign.n.length;i+=2){const a=[i,i+1].filter(j=>j<T.sign.n.length);rows.push(`<tr>${a.map(j=>`<th>${T.sign.n[j]}</th><td>${T.sign.v05[j]}</td><td>${T.sign.v01[j]}</td>`).join('')}</tr>`);}
    body=`<table class="nt"><thead><tr><th>N</th><th>5%</th><th>1%</th><th>N</th><th>5%</th><th>1%</th></tr></thead><tbody>${rows.join('')}</tbody></table><p class="note">符号検定表（両側）。少ないほうの個数がこの値以下なら有意。系列相関（大波・小波）の判定に使う。二項分布 B(N, 0.5) から算出。</p>`;}
  return `<div class="seg" style="flex-wrap:wrap;margin-bottom:10px">${tabs.map(([k,l])=>`<button data-tt="${k}" data-where="${where}" aria-pressed="${tableTab===k}">${l}</button>`).join('')}</div><div class="tblwrap">${body}</div>`;
}

// 出力系統：コンプレッサー → スピーカー。残響（短いホール）を少しだけ混ぜて、明るく広がる音にする
let OUT=null,REV=null;
function ac(){
  // 閉じられた・壊れた出力は作り直す（アプリの切り替えなどで止まることがある）
  if(AC&&(AC.state==='closed'||AC.state==='interrupted')){try{AC.close();}catch(e){}AC=null;}
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C({latencyHint:'interactive'});
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=3;comp.connect(AC.destination);
    OUT=AC.createGain();OUT.gain.value=0.9;OUT.connect(comp);
    // 残響：減衰するノイズでインパルス応答を合成
    const len=Math.floor(AC.sampleRate*1.1),buf=AC.createBuffer(2,len,AC.sampleRate);
    for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
    const cv=AC.createConvolver();cv.buffer=buf;REV=AC.createGain();REV.gain.value=0.22;REV.connect(cv);cv.connect(comp);}
  if(AC.state==='suspended')AC.resume();return AC;
}
// エンベロープ付きの1音。wet は残響に送る量
function osc(f,at,dur,{type='sine',vol=0.2,a=0.006,slide=0,wet=0.5,lp=0,detune=0}={}){
  const c=ac();if(!c)return;const t=c.currentTime+at;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);o.detune.value=detune;
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur*0.9);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  let node=o.connect(g);
  if(lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=lp;node=g.connect(fl);}
  node.connect(OUT);if(wet){const s=c.createGain();s.gain.value=wet;node.connect(s).connect(REV);}
  o.start(t);o.stop(t+dur+0.05);
}
// ベル（鉄琴のような音）：基音＋非整数倍音を重ねる
function bell(f,at,vol=0.16,dur=0.5){osc(f,at,dur,{vol,wet:.5});osc(f*2,at,dur*0.5,{vol:vol*.32,wet:.5});osc(f*3,at,dur*0.22,{vol:vol*.1,wet:.4});}
// 明るいシンセの和音（ファンファーレ用）：のこぎり波2本を少しずらして柔らかく
function pad(f,at,dur,vol=0.07){osc(f,at,dur,{type:'sawtooth',vol,a:.02,lp:2400,detune:-7,wet:.5});osc(f,at,dur,{type:'sawtooth',vol,a:.02,lp:2400,detune:7,wet:.5});}
// キラキラ：高音の短いベルをランダムに散らす
// 余韻の飾り：主和音（ド・ミ・ソ）の音だけを順に、小さく鳴らす（不協和にならないよう乱数は使わない）
function sparkle(at,n=6){const T=[1567.98,2093,1318.51,1567.98,2093,2637.02];for(let i=0;i<n;i++)bell(T[i%T.length],at+i*0.06,0.035,0.3);}
// バイブレーション（Android の Chrome とアプリ版。iPhone の Safari は未対応）
const VIBE={tap:8,right:[18,40,26],combo:[18,35,18,35,40],partial:[30,60,30],wrong:[60,50,60],fanfare:[30,60,30,60,30,60,140],goal:[30,50,30,50,30,50,30,50,180],end:[50],clear:[30,60,30,60,140]};

function sfx(kind){

  try{
    const C=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5,1174.66,1318.51,1396.91,1567.98,1760,1975.53,2093];
    if(kind==='tap'){osc(1200,0,0.05,{vol:.08,slide:1700,wet:0});osc(2400,0,0.02,{type:'triangle',vol:.03,wet:0});}
    // 正解：明るい2音のチャイム（ド→ミの完全な響き）

    // 連続正解・大問全問正解：上昇アルペジオ＋キラキラ
    // 連続正解・大問全問正解：正解と同じチャイムに、もう1音（上のド）を足しただけの控えめな上昇
    else if(kind==='combo'){bell(1046.5,0,.15,.45);bell(1318.51,0.08,.14,.45);bell(1567.98,0.16,.14,.6);osc(523.25,0,.3,{type:'triangle',vol:.05,wet:.3});}
    // 一部正解：やわらかい2音

    else if(kind==='partial'){bell(783.99,0,.12,.35);osc(392,0,.25,{type:'triangle',vol:.05,wet:.3});}
    // 不正解：低く丸い「ぼん・ぼん」（耳に痛くないよう低域を残してこもらせる）
    else if(kind==='wrong'){osc(311,0,0.17,{type:'triangle',vol:.22,lp:900,wet:.2});osc(155.5,0,0.17,{type:'sine',vol:.18,wet:.1});osc(233,0.15,0.32,{type:'triangle',vol:.2,lp:800,slide:208,wet:.25});osc(116.5,0.15,0.32,{type:'sine',vol:.16,wet:.1});}
    // レッスン完了：ファンファーレ（ド・ミ・ソ → 主和音）＋キラキラ
    else if(kind==='fanfare'||kind==='clear'){
      [[523.25,0],[659.25,.12],[783.99,.24]].forEach(([f,t])=>{pad(f,t,.18,.06);bell(f*2,t,.1,.3);});
      [523.25,659.25,783.99,1046.5].forEach(f=>pad(f,.38,1.1,.05));bell(2093,.38,.12,1.2);bell(1567.98,.38,.1,1);osc(130.81,.38,1.1,{type:'triangle',vol:.12,wet:.3});sparkle(.55,8);}

    else if(kind==='goal'){[0,2,4,7,9,11].forEach((k,i)=>bell(C[k+2]||2093,i*0.06,.12,.3));[659.25,830.61,987.77,1318.51].forEach(f=>pad(f,.42,1.2,.05));bell(2637,.42,.1,1.2);osc(164.81,.42,1.2,{type:'triangle',vol:.12,wet:.3});sparkle(.6,10);}
    else if(kind==='end'){[783.99,659.25,523.25].forEach((f,i)=>bell(f,i*0.15,.12,.45));}

}
// 紙吹雪（目標達成・合格のとき）。動きを減らす設定の端末では出さない
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cv=document.createElement('canvas'),W=innerWidth,H=innerHeight,dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;
  cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:60';document.body.appendChild(cv);

  const col=['#1d5c7a','#2c7a4b','#c77412','#c03d2a','#72b6d6','#6cc290'];

// ===== 電卓（試験で使える √ 付き電卓を想定。メモリ M+ M− MR MC つき） =====
const CALC={ex:'',res:null,mem:0,err:''};
// 式を安全に計算する（eval は使わず、四則・かっこ・√・二乗だけを解釈する）
function calcEval(src){
  const t=src.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');let i=0;
  const peek=()=>t[i],eat=c=>{if(t[i]===c){i++;return true;}return false;};
  function num(){let s=i;while(i<t.length&&/[0-9.]/.test(t[i]))i++;if(s===i)throw 0;const v=parseFloat(t.slice(s,i));if(isNaN(v))throw 0;return v;}
  function atom(){
    if(eat('-'))return -atom();
    if(eat('√'))return Math.sqrt(atom());
    let v;if(eat('(')){v=expr();if(!eat(')'))throw 0;}else if(t.startsWith('Ans',i)){i+=3;v=CALC.res||0;}else v=num();
    while(eat('²'))v=v*v;return v;}
  function term(){let v=atom();for(;;){if(eat('*'))v*=atom();else if(eat('/'))v/=atom();else return v;}}
  function expr(){let v=term();for(;;){if(eat('+'))v+=term();else if(eat('-'))v-=term();else return v;}}
  const v=expr();if(i<t.length)throw 0;return v;
}
const fmtCalc=v=>{if(!isFinite(v))return'エラー';const a=Math.abs(v);if(a!==0&&(a>=1e10||a<1e-6))return v.toExponential(6);return String(+v.toPrecision(10));};
function calcHTML(){
  const K=[['MC','MR','M−','M+'],['C','(',')','⌫'],['√','x²','÷','×'],['7','8','9','−'],['4','5','6','+'],['1','2','3','='],['0','.','Ans','']];
  return `<div class="sheethead"><strong>電卓</strong><button class="iconbtn" data-cclose aria-label="閉じる">${ICON.close}</button></div>
  <div class="cdisp" aria-live="polite"><div class="cexp">${esc(CALC.ex)||'&nbsp;'}</div><div class="cres">${CALC.err?esc(CALC.err):CALC.res!=null?esc(fmtCalc(CALC.res)):'0'}</div>${CALC.mem?`<span class="cmem">M ${esc(fmtCalc(CALC.mem))}</span>`:''}</div>
  <div class="ckeys">${K.flat().map(k=>k?`<button class="ck ${k==='='?'eq':/^[0-9.]$|Ans/.test(k)?'n':'op'}" data-ck="${k}" aria-label="${{'⌫':'1文字消す','√':'ルート','x²':'二乗','−':'引く','×':'掛ける','÷':'割る','M+':'メモリに足す','M−':'メモリから引く','MR':'メモリを呼び出す','MC':'メモリを消す','C':'クリア'}[k]||k}">${k}</button>`:'<span></span>').join('')}</div>`;
}

function calcPress(k){
  CALC.err='';
  const cur=()=>{try{return calcEval(CALC.ex);}catch(e){return null;}};
  if(k==='C'){CALC.ex='';CALC.res=null;}
  else if(k==='⌫')CALC.ex=CALC.ex.endsWith('Ans')?CALC.ex.slice(0,-3):CALC.ex.slice(0,-1);
  else if(k==='='){if(!CALC.ex)return;const v=cur();if(v==null){CALC.err='式を確認してください';}else{CALC.res=v;CALC.ex='';}}
  else if(k==='x²')CALC.ex+='²';
  else if(k==='MC')CALC.mem=0;
  else if(k==='MR')CALC.ex+=fmtCalc(CALC.mem);
  else if(k==='M+'||k==='M−'){const v=CALC.ex?cur():CALC.res;if(v==null){CALC.err='式を確認してください';}else{CALC.mem+=k==='M+'?v:-v;if(CALC.ex){CALC.res=v;CALC.ex='';}}}
  else{
    // 計算結果のすぐ後に演算子を押したら、結果（Ans）から続ける
    if(!CALC.ex&&CALC.res!=null&&/^[+−×÷²]$/.test(k))CALC.ex='Ans';
    CALC.ex+=k;}
  $('#calcBody').innerHTML=calcHTML();
}

// ===== 問題に関係する数値表を開く =====
// 解説の表記（t(9, 0.05)、χ²(9, 0.025)、F(2, 6; 0.05)、K＝1.37、n＝5、N＝36）から表と該当のマスを決める
function tableFor(text){
  let m;
  if((m=text.match(/F\((\d+), ?(\d+); ?(0\.0?25|0\.05)\)/)))return{tab:m[3]==='0.05'?'F05':'F025',r:T.F.f2.indexOf(+m[2]),c:T.F.f1.indexOf(+m[1])};
  if((m=text.match(/χ²\((\d+), ?([0-9.]+)\)/)))return{tab:'chi2',r:T.chi2.df.indexOf(+m[1]),c:T.chi2.P.indexOf(+m[2])};
  if((m=text.match(/\bt\((\d+), ?(0\.\d+)\)/)))return{tab:'t',r:T.t.df.indexOf(+m[1]),c:T.t.P.indexOf(+m[2])};
  if((m=text.match(/符号検定表|大波|小波/))){const n=text.match(/N＝(\d+)/);return{tab:'sign',n:n?+n[1]:null};}
  if(/管理図|A2|D4|d2|X̄|R̄/.test(text)){const n=text.match(/n＝(\d+)/);return{tab:'cc',r:n?Object.keys(CC).indexOf(n[1]):-1,c:-1};}
  if((m=text.match(/K＝(\d)\.(\d)(\d)/)))return{tab:'norm',r:+m[1]*10+ +m[2],c:+m[3]};
  if(/正規分布|上側確率|u0|標準正規/.test(text))return{tab:'norm',r:-1,c:-1};
  if(/t ?分布|t0|t 検定/.test(text))return{tab:'t',r:-1,c:-1};
  if(/χ²|カイ二乗/.test(text))return{tab:'chi2',r:-1,c:-1};
  if(/分散比|F0|F 検定/.test(text))return{tab:'F05',r:-1,c:-1};
  return null;
}

    :`<div class="srow"><div class="t"><b>毎日のリマインダー</b><span>Android アプリ版で使えます。Web 版では通知を送れません。</span></div></div>`}
  </div>
  <div class="setcard"><h3>このアプリについて</h3>
    <div class="srow"><div class="t"><b>はじめの案内</b><span>初回起動時の設定（受験日・目標・表示・通知）をもう一度行う</span></div><button class="btn ghost sm" data-reonb>表示する</button></div>
    <div class="srow"><div class="t"><b>バージョン</b><span>${APP.date} 更新</span></div><span class="ver-big" style="font-size:1.1rem">v${APP.version}</span></div>
    <div style="padding:6px 0 10px">${H.slice(0,3).map(([v,d,t])=>`<div class="hist"><b>v${v}</b><span class="d">${d}</span><span>${esc(t)}</span></div>`).join('')}
    ${H.length>3?`<details class="oldhist"><summary>以前の変更（${H.length-3}件）</summary>${H.slice(3).map(([v,d,t])=>`<div class="hist"><b>v${v}</b><span class="d">${d}</span><span>${esc(t)}</span></div>`).join('')}</details>`:''}</div>
  </div>`;
}
function openSettings(){$('#setBody').innerHTML=settingsHTML();showSheet('#setSheet');$('#setClose').focus();}
function refreshSettings(){const y=$('#setSheet .in')?$('#setSheet').scrollTop:0;$('#setBody').innerHTML=settingsHTML();$('#setSheet').scrollTop=y;render();}
$('#setBtn').innerHTML=ICON.tune;$('#setClose').innerHTML=ICON.close;$('#sheetClose').innerHTML=ICON.close;
$('#setBtn').addEventListener('click',()=>{sfx('tap');openSettings();});
$('#streakChip').addEventListener('click',()=>{sfx('tap');streakSheet();});
$('#setClose').addEventListener('click',()=>{closeSheets();$('#setBtn').focus();});
$('#setSheet').addEventListener('click',e=>{
  if(e.target.closest('[data-reonb]')){closeSheets();openOnb();return;}
  const ts=e.target.closest('[data-test-sound]');if(ts){const was=soundOn;soundOn=true;unlockAudio();sfx('right');soundOn=was;setTimeout(()=>{const el=$('#audState');if(el)el.textContent='状態：'+audioState()+'。鳴らないときは、端末の「メディアの音量」を上げてください（着信音の音量とは別です）。';},300);return;}
  const t=e.target.closest('[data-test-notify]');if(t){const b=APPB();if(b)try{b.testNotify();toast('テスト通知を送りました');}catch(x){}return;}
  const w=e.target.closest('[data-sw]');
  if(w){const k=w.dataset.sw;
    if(k==='sound'){soundOn=!soundOn;try{localStorage.setItem('qc2-sound',soundOn?'on':'off');}catch(x){}if(soundOn)sfx('tap');}
    if(k==='vibe'){vibeOn=!vibeOn;try{localStorage.setItem('qc2-vibe',vibeOn?'on':'off');}catch(x){}if(vibeOn)buzz('right');}
    if(k==='remind'){const c=remindCfg();c.on=!c.on;saveRemind(c);syncNative();}
    refreshSettings();return;}
  const b=e.target.closest('[data-setk]');if(!b)return;const k=b.dataset.setk,v=b.dataset.val;
  if(k==='theme'){theme=v;try{localStorage.setItem('qc2-theme',v);}catch(x){}applyTheme();}
  if(k==='fs'){fontScale=v;try{localStorage.setItem('qc2-fs',v);}catch(x){}applyFont();}
  if(k==='goal'){P.goal=+v;persist();}
  sfx('tap');refreshSettings();});
$('#setSheet').addEventListener('change',e=>{
  if(e.target.id==='examSel'){try{localStorage.setItem('qc2-exam',e.target.value);}catch(x){}refreshSettings();}
  if(e.target.id==='examDate'){try{localStorage.setItem('qc2-exam-date',e.target.value);}catch(x){}render();}
  if(e.target.id==='remTime'){const [h,m]=e.target.value.split(':').map(Number);const c=remindCfg();c.h=h||0;c.m=m||0;saveRemind(c);toast(`毎日 ${e.target.value} に通知します`);}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen())closeSheets();});
function syncSoundBtn(){}

syncSoundBtn();
initStore();syncNative();maybeOnb();
// アプリ版：起動時にリマインダー設定をアプリ側へ渡し直す
{const c=remindCfg();if(c.on)saveRemind(c);}
setInterval(countdown,60e3);
